[package]
name = "bedplotter"
version = "0.1.0"
edition = "2021"
authors = ["pidop"]
description = "Native desktop tool for transforming 3D printers into pen plotters with perspective calibration"

[dependencies]
eframe = { version = "0.29", default-features = false, features = ["default", "wgpu"] }
egui = "0.29"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
directories = "5.0"
nalgebra = "0.33"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
rfd = "0.15"
usvg = "0.43"
lyon = "1.0"
